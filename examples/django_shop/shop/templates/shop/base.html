<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Sneaker Drop{% endblock %}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #f5f5f7; color: #1d1d1f; display: flex; min-height: 100vh;
           align-items: center; justify-content: center; margin: 0; }
    .card { background: #fff; padding: 2rem 2.5rem; border-radius: 16px; max-width: 460px;
            width: 92%; box-shadow: 0 10px 40px rgba(0,0,0,.08); }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    .muted { color: #6e6e73; font-size: .9rem; }
    .btn { display: inline-block; margin-top: 1.25rem; padding: .7rem 1.2rem; border: 0;
           border-radius: 10px; background: #0071e3; color: #fff; font-size: 1rem;
           text-decoration: none; cursor: pointer; }
    dl { display: grid; grid-template-columns: auto auto; gap: .25rem 1rem; font-size: .9rem; }
    dt { color: #6e6e73; }
  </style>
</head>
<body><main class="card">{% block content %}{% endblock %}</main></body>
</html>
