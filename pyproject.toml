[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "waiting_room"
version = "0.1.0"
description = "Plug-and-play virtual waiting room for high-traffic Python web apps."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Aniket Maithani" }]
keywords = [
  "waiting-room",
  "queue",
  "rate-limiting",
  "redis",
  "django",
  "flash-sale",
  "ticketing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Framework :: Django",
]
dependencies = [
  "redis>=5.0",
]

[project.optional-dependencies]
django = ["django>=4.2"]
metrics = ["prometheus_client>=0.19"]
logging = ["structlog>=24.0"]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
  "fakeredis[lua]>=2.21",
  "django>=4.2",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/m37labs/waiting_room"
Issues = "https://github.com/m37labs/waiting_room/issues"

[tool.hatch.build.targets.wheel]
packages = ["waiting_room"]

[tool.hatch.build.targets.wheel.shared-data]
"waiting_room/core/lua" = "waiting_room/core/lua"

[tool.hatch.build]
include = [
  "waiting_room/**/*.py",
  "waiting_room/**/*.lua",
  "waiting_room/**/*.html",
  "README.md",
  "LICENSE",
]

# ==== pytest =================================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["waiting_room/tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
DJANGO_SETTINGS_MODULE = "waiting_room.tests._test_settings"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:fakeredis.*",
  "ignore::DeprecationWarning:django.*",
]

# ==== ruff ===================================================================

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # import order
  "UP",               # pyupgrade
  "B",                # bugbear
  "C4",               # comprehensions
  "SIM",              # simplify
  "RET",              # return cleanup
  "PT",               # pytest style
  "S",                # bandit
  "TID",              # tidy imports
  "RUF",
]
ignore = [
  "S101",   # asserts ok
  "S311",   # not all `random` is crypto
  "RUF012", # mutable class attrs annotation
]

[tool.ruff.lint.per-file-ignores]
"waiting_room/tests/*" = ["S105", "S106", "PT011"]

# ==== mypy ===================================================================

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

# Django ships without type information (no django-stubs dependency), so its
# base classes and decorators are ``Any``. Relax only the checks that trips.
[[tool.mypy.overrides]]
module = "waiting_room.adapters.django.*"
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "waiting_room.adapters.django.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "waiting_room.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_subclassing_any = false
